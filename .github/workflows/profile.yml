# Nightly refresh of the live parts of github.com/jtlgrowth: the contribution
# snake and the log card. Both land on the orphan `output` branch, rewritten
# each run, so main (and jtlgrowth.com) never sees a bot commit.
name: profile

on:
  schedule:
    - cron: "17 16 * * *" # 00:17 Manila
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/profile/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # runs first so dist/ belongs to the runner, not the snake container
      - name: Log card
        run: python3 .github/profile/build.py stats --out dist
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#E2E2E2&color_dots=#161616,#3A3A3A,#6B6B6B,#A8A8A8,#E2E2E2
            dist/snake-light.svg?color_snake=#121212&color_dots=#EBEBEB,#C4C4C4,#8F8F8F,#585858,#121212

      - name: Publish to the output branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "profile: refresh $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
