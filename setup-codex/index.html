const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,b(CT));
  return new TextDecoder().decode(pt);
}
async function tryPw(pw,silent){
  try{
    const html=await unlock(pw);
    sessionStorage.setItem("jtl-setup-codex-code",pw);
    document.open();document.write(html);document.close();
  }catch(e){
    if(!silent){document.getElementById("err").classList.add("on");document.getElementById("pw").value="";}
    else{sessionStorage.removeItem("jtl-setup-codex-code");}
  }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("pw").value.trim(),false);});
const saved=sessionStorage.getItem("jtl-setup-codex-code");if(saved)tryPw(saved,true);
