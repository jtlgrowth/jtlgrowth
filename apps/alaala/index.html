/* PROJECT SETTINGS: venice-base roles first, then the Dikit papers (light), redefined for night below. */
:root {
  --bg: #cfb48e;
  --surface: #f6f0e3;

  --dot: #c7bfae;

  --night: #2a221a;
  --night-2: #3a2e22;
  --night-ink: #f3e6d0;
  --tape-pink: #f5b3ab; --tape-pink-2: #fad6cf;
  --tape-mint: #a1c7bf; --tape-mint-2: #c7e3d9;
  --tape-sun: #f5e06b; --tape-sun-2: #faed9e;
  --cov-tomato: #d9643f; --cov-sage: #6b8f6e; --cov-navy: #2b3a5c; --cov-rose: #d98f8f; --cov-mustard: #d9b23f; --cov-teal: #3f8a8a; --cov-plum: #6a3f5c;
  --photo-a: #ff8a3d; --photo-b: #ff3d6e; --photo-sun: #ffcc00; --photo-c: #00c4cc; --photo-d: #34c759;

  --font-display: "Caveat", "Bradley Hand", "Segoe Print", cursive;

  --text-xs: 13px; --text-sm: 15px; --text-base: 17px; --text-lg: 20px; --text-xl: 24px;

  --section-y-phone: 64px; --section-y-tablet: 88px; --section-y-desktop: 112px;

  color-scheme: light;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

/* Washi tape, stamps, polaroids: the scrapbook pieces, same as the app */
.tape { position: absolute; z-index: 3; width: 74px; height: 22px; background: repeating-linear-gradient(-45deg, var(--t1, var(--tape-pink)) 0 7px, var(--t2, var(--tape-pink-2)) 7px 14px); opacity: .92; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); pointer-events: none; }
.tape.mint { --t1: var(--tape-mint); --t2: var(--tape-mint-2); }
.tape.sun { --t1: var(--tape-sun); --t2: var(--tape-sun-2); }
.stamp { display: inline-block; padding: 4px 12px; border: 2.5px solid var(--stamp); border-radius: 7px; color: var(--stamp); font: 800 var(--text-sm)/1.2 var(--font-mono); letter-spacing: .04em; text-transform: none; rotate: -2.5deg; mix-blend-mode: multiply; }
@media (prefers-color-scheme: dark) { .stamp { mix-blend-mode: normal; } }
.polaroid { position: relative; background: var(--frame); padding: 8% 8% 22%; box-shadow: var(--elev-raised); }
.polaroid .ph { aspect-ratio: 1; }
.ph.sunset { background: radial-gradient(circle at 50% 50%, var(--photo-sun) 0 17%, transparent 18%), linear-gradient(160deg, var(--photo-a), var(--photo-b)); }
.ph.hill { background: radial-gradient(ellipse 90% 40% at 50% 100%, var(--photo-d) 0 99%, transparent 100%), linear-gradient(180deg, var(--photo-c), var(--tape-mint)); }
.dotted { background-color: var(--paper); background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.6px); background-size: 20px 20px; }
.spiral { position: absolute; left: 5%; top: 4%; bottom: 4%; width: 7%; background: radial-gradient(circle at 50% 50%, var(--ink) 0 34%, var(--border-soft) 36% 52%, transparent 54%) 0 0 / 100% 7.4% repeat-y; z-index: 2; pointer-events: none; }

/* Top bar: frosted glass over the drift (depth layer) */
.top { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding-block: var(--space-4); }
.brand { display: flex; align-items: center; gap: var(--space-2); text-decoration: none; padding: 4px 14px 4px 4px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--paper) 62%, transparent); -webkit-backdrop-filter: blur(10px) saturate(1.2); backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 4px 14px -6px var(--shadow); }
.brand img { width: 40px; height: 40px; border-radius: 10px; display: block; }
.brand b { font: 700 30px/1 var(--font-display); color: var(--ink-kraft); }
.top-r { display: flex; align-items: center; gap: var(--space-2); }
.chip { display: inline-flex; align-items: center; gap: var(--space-2); padding: 7px 13px; border-radius: var(--radius-pill); background: color-mix(in srgb, var(--paper) 70%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font: 700 var(--text-xs)/1.2 var(--font-body); color: var(--ink-kraft); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--stamp); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: color-mix(in srgb, var(--paper) 70%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); cursor: pointer; box-shadow: 0 4px 12px -6px var(--shadow); color: var(--ink-kraft); }
.iconbtn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn:active { transform: scale(.96); }

/* Drift: the background movement layer. One direction (up and to the right), linear, two lanes. */
.drift { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.drift i { position: absolute; top: 100%; display: block; animation: drift linear infinite; will-change: transform; }
.drift i.far { filter: blur(2.5px); opacity: .45; }
.drift i.near { opacity: .7; }
.drift i.tp { width: 46px; height: 14px; background: repeating-linear-gradient(-45deg, var(--t1) 0 6px, var(--t2) 6px 12px); }
.drift i.cf { width: 12px; height: 12px; border-radius: 2px; background: var(--paper); box-shadow: 0 1px 2px var(--shadow); }
.drift i.ht { width: 14px; height: 13px; background: var(--stamp); clip-path: path("M7 13 1 7a3.5 3.5 0 0 1 6-4.6A3.5 3.5 0 0 1 13 7z"); opacity: .5; }
@keyframes drift { from { transform: translate3d(0, 0, 0) rotate(var(--r, 0deg)); } to { transform: translate3d(var(--dx, 18vw), calc(-100vh - 140%), 0) rotate(var(--r, 0deg)); } }

/* Hero: the notebook leads (visual left, one headline, one line, one CTA) */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: var(--space-12); min-height: calc(100svh - 84px); padding-bottom: var(--space-8); }
.desk { position: relative; width: 100%; aspect-ratio: 1; border-radius: 34px; background: var(--kraft-deep); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08), inset 0 18px 40px -20px rgba(0, 0, 0, .35), var(--elev-raised); overflow: hidden; container-type: inline-size; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; perspective: 1800px; }
.desk::before { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .7; mix-blend-mode: multiply; pointer-events: none; }
/* Loose things on the desk: drag them around */
.loose { position: absolute; z-index: 2; touch-action: none; cursor: grab; }
.loose:active { cursor: grabbing; }
.loose.p1 { width: 24cqw; left: 5cqw; top: 8cqw; rotate: -9deg; }
.loose.p2 { width: 21cqw; right: 6cqw; bottom: 9cqw; rotate: 7deg; }
.loose .tape { width: 11cqw; height: 3.4cqw; left: 50%; top: -1.6cqw; translate: -50% 0; rotate: -4deg; }
.pencil { position: absolute; z-index: 1; left: 9cqw; bottom: 13cqw; width: 34cqw; height: 3.2cqw; rotate: -28deg; pointer-events: none; }
.pencil svg, .rubber svg { width: 100%; height: 100%; display: block; overflow: visible; }
.rubber { position: absolute; z-index: 1; right: 7cqw; top: 9cqw; width: 15cqw; height: 15cqw; pointer-events: none; rotate: 12deg; }
.p-wood { fill: var(--highlight); } .p-tip { fill: var(--photo-sun); opacity: .0; } .p-lead { fill: var(--ink); } .p-shave { fill: var(--surface-warm); } .p-end { fill: var(--cov-rose); } .p-band { fill: var(--border-soft); }
.r-h { fill: var(--cov-tomato); } .r-b { fill: var(--ticket-edge); } .r-p { fill: var(--stamp); }

.book { position: absolute; z-index: 3; left: 50%; top: 50%; width: 42cqw; aspect-ratio: 3 / 4; translate: -50% -50%; transform-style: preserve-3d; transition: translate var(--motion-page) var(--ease-page); }
.book.open { translate: 0% -50%; }
.book .sheet { position: absolute; inset: 0; border-radius: 2px 10px 10px 2px; box-shadow: var(--elev-raised); overflow: hidden; container-type: inline-size; }
.book .sheet .in { position: absolute; inset: 9cqw 8cqw 8cqw 11cqw; display: flex; flex-direction: column; gap: 5cqw; }
.book .sheet .stamp { font-size: 7.4cqw; padding: 1.6cqw 4cqw; border-width: 0.9cqw; align-self: flex-start; opacity: 0; scale: 1.4; transition: opacity .2s, scale .35s var(--ease-spring); }
.book.open .sheet .stamp { opacity: 1; scale: 1; transition-delay: .9s; }
.book .sheet .time { font: 400 8.5cqw/1 var(--font-hand); color: var(--ink-soft); }
.book .sheet .line { font: 400 9.6cqw/1.25 var(--font-hand); color: var(--ink); clip-path: inset(0 100% 0 0); transition: clip-path 1.6s steps(28) 1.2s; }
.book.open .sheet .line { clip-path: inset(0 0 0 0); }
@keyframes write { to { clip-path: inset(0 0 0 0); } }
.book .sheet .hint-in { margin-top: auto; font: 700 6.2cqw/1.2 var(--font-body); color: var(--ink-soft); opacity: 0; transition: opacity .4s 2.9s; }
.book.open .sheet .hint-in { opacity: .85; }
.book.open.stamped .sheet .hint-in { opacity: 0; transition: opacity var(--motion-base); }
.cover { position: absolute; inset: 0; z-index: 4; transform-origin: 0 50%; transform-style: preserve-3d; transition: transform var(--motion-page) var(--ease-page); cursor: pointer; border: 0; padding: 0; background: none; border-radius: 2px 10px 10px 2px; }
.book.open .cover { transform: rotateY(-176deg); cursor: default; }
/* WebKit paints a backface-hidden face's children through the flipped cover, so each side also hides itself at the half-turn */
.cover .face { transition: visibility 0s linear .5s; }
.cover .back { visibility: hidden; transition: visibility 0s linear .5s; }
.book.open .cover .face { visibility: hidden; }
.book.open .cover .back { visibility: visible; }
.cover .face, .cover .back { position: absolute; inset: 0; border-radius: 2px 10px 10px 2px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.cover .face { background: radial-gradient(circle at 30% 26%, var(--cov-tomato) 0 22%, transparent 48%), radial-gradient(circle at 74% 52%, var(--cov-mustard) 0 16%, transparent 40%), radial-gradient(circle at 34% 78%, var(--cov-navy) 0 14%, transparent 36%), var(--photo-a); box-shadow: var(--elev-raised); container-type: inline-size; }
.cover .face::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .55; mix-blend-mode: multiply; }
.cover .face .tape { top: -1.5%; left: 50%; translate: -50% 0; width: 34%; height: 8%; rotate: 3deg; }
.cover .label { position: absolute; left: 20%; right: 10%; top: 56%; padding: 3% 4%; background: var(--paper); box-shadow: 0 2px 4px rgba(0, 0, 0, .2); rotate: -2deg; font: 700 15cqw/1 var(--font-display); color: var(--ink); text-align: center; z-index: 2; }
.cover .back { transform: rotateY(180deg); background: var(--surface-warm); box-shadow: var(--elev-raised); container-type: inline-size; }
.cover .back .polaroid { position: absolute; width: 62%; left: 20%; top: 18%; rotate: -5deg; padding: 6% 6% 18%; }
.cover .back .polaroid .tape { width: 50%; height: 12%; top: -5%; left: 25%; }
.cover .back .cap { position: absolute; left: 0; right: 0; bottom: 14%; text-align: center; font: 700 11cqw/1 var(--font-display); color: var(--ink-kraft); }
.dropped { position: absolute; z-index: 6; pointer-events: none; font-size: 3.6cqw; padding: .7cqw 1.8cqw; border-width: .45cqw; border-radius: 1cqw; translate: -50% -50%; animation: thunk .34s var(--ease-spring) both; white-space: nowrap; }
@keyframes thunk { from { scale: 1.6; opacity: 0; } to { scale: 1; opacity: .92; } }
.tap-me { position: absolute; z-index: 5; left: 50%; bottom: 6%; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); box-shadow: var(--elev-raised); font: 700 var(--text-sm)/1.1 var(--font-body); pointer-events: none; transition: opacity var(--motion-base), translate var(--motion-base) var(--ease-standard); white-space: nowrap; }
.tap-me svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tap-me.gone { opacity: 0; translate: -50% 10px; }

.copy h1 { font-size: var(--text-4xl); color: var(--ink-kraft); }
.copy h1 em { font-style: normal; color: var(--stamp); }
.copy .one { margin: var(--space-4) 0 0; max-width: 34ch; font: 400 clamp(21px, 2vw, 25px)/1.35 var(--font-hand); color: var(--ink-kraft); }
.cta-row { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-8); align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 26px; border: 0; border-radius: var(--radius-pill); background: var(--ink-kraft); color: var(--paper); font: 700 var(--text-lg)/1 var(--font-body); text-decoration: none; cursor: pointer; box-shadow: 0 10px 22px -10px var(--shadow); transition: transform var(--motion-fast), box-shadow var(--motion-fast); }
.btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn:active { transform: translateY(2px) scale(.98); }
.btn.paper { background: var(--paper); color: var(--ink); }
.btn.stampy { background: var(--stamp); color: var(--accent-on); }
.btn.sm { min-height: 46px; padding: 0 18px; font-size: var(--text-base); }
.store-hint { margin: var(--space-3) 0 0; font: 600 var(--text-sm)/1.4 var(--font-body); color: var(--ink-kraft); opacity: .85; }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; translate: -50% 20px; padding: 12px 20px; border-radius: var(--radius-pill); background: var(--ink-kraft); color: var(--paper); font: 700 var(--text-sm)/1.25 var(--font-body); opacity: 0; transition: opacity var(--motion-base), translate var(--motion-base) var(--ease-standard); pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; translate: -50% 0; }

/* Sections */
section.band { position: relative; padding-block: var(--section-y-phone); }
.kick { display: inline-block; margin-bottom: var(--space-4); }
h2.hand { font-size: var(--text-3xl); color: var(--ink-kraft); }
.lead { max-width: 52ch; margin: var(--space-4) 0 0; font: 400 clamp(20px, 1.8vw, 23px)/1.4 var(--font-hand); color: var(--ink-kraft); }
.band.paperband { background: var(--paper); }
.band.paperband h2.hand, .band.paperband .lead { color: var(--ink); }
.band.dotband { background-color: var(--paper); background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.6px); background-size: 22px 22px; }
.band.dotband h2.hand, .band.dotband .lead { color: var(--ink); }

/* Night: where the days go */
.night { background: var(--night); color: var(--night-ink); overflow: hidden; }
.night h2.hand, .night .lead { color: var(--night-ink); }
.night .stamp { border-color: var(--highlight); color: var(--highlight); mix-blend-mode: normal; }
.scraps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-6); margin-top: var(--space-8); }
.scrap { position: relative; padding: var(--space-6) var(--space-5) var(--space-5); background: var(--paper); color: var(--ink); box-shadow: 0 16px 30px -14px rgba(0, 0, 0, .7); clip-path: polygon(0 3%, 6% 0, 14% 2%, 24% 0, 38% 3%, 52% 0, 66% 2%, 80% 0, 92% 3%, 100% 0, 100% 97%, 90% 100%, 76% 98%, 62% 100%, 48% 97%, 34% 100%, 20% 98%, 8% 100%, 0 97%); }
.scrap:nth-child(1) { rotate: -2deg; } .scrap:nth-child(2) { rotate: 1.5deg; translate: 0 14px; } .scrap:nth-child(3) { rotate: -1deg; }
.scrap b { display: block; font: 700 clamp(30px, 3vw, 40px)/1 var(--font-display); }
.scrap span { display: block; margin-top: 8px; font: 400 var(--text-lg)/1.3 var(--font-hand); color: var(--ink-soft); }
.cost { margin-top: var(--space-12); font: 700 var(--text-2xl)/1.15 var(--font-display); color: var(--highlight); text-wrap: balance; }

/* Real app: a stack of polaroid screenshots, tap to toss the top one to the back */
.real { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-12); align-items: center; }
.pile { position: relative; justify-self: center; width: min(340px, 74vw); aspect-ratio: 0.56; touch-action: manipulation; }
.shot { position: absolute; inset: 0; margin: 0; padding: 12px 12px 54px; background: var(--frame); box-shadow: var(--elev-raised); border: 0; cursor: pointer; transition: transform .6s var(--ease-standard), opacity .3s; transform: rotate(var(--rot, 0deg)) translate(var(--tx, 0), 0); }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 4px; background: var(--paper); }
.shot figcaption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 700 26px/1 var(--font-display); color: var(--ink); }
.shot .tape { top: -10px; left: 50%; translate: -50% 0; width: 96px; height: 26px; }
.shot.toss { transform: translate(130%, -10%) rotate(18deg); opacity: 0; }
.pile-nav { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-6); }
.pile-nav .n { font: 700 var(--text-sm)/1 var(--font-mono); color: var(--ink-kraft); }
.real .says { margin-top: var(--space-6); min-height: 4.2em; font: 400 var(--text-xl)/1.35 var(--font-hand); color: var(--ink-kraft); }

/* How: three taped cards */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-8); margin-top: var(--space-12); }
.step { position: relative; padding: var(--space-8) var(--space-6) var(--space-6); background: var(--surface); box-shadow: var(--elev-raised); }
.step:nth-child(1) { rotate: -1.4deg; } .step:nth-child(2) { rotate: 1deg; } .step:nth-child(3) { rotate: -.6deg; }
.step .tape { top: -11px; left: 50%; translate: -50% 0; }
.step .art { height: 132px; display: grid; place-items: center; margin-bottom: var(--space-4); }
.step h3 { margin: 0 0 8px; font: 700 34px/1 var(--font-display); color: var(--ink); }
.step p { margin: 0; font: 400 var(--text-lg)/1.4 var(--font-hand); color: var(--ink-soft); }
.mini-nb { position: relative; width: 84px; height: 110px; border-radius: 2px 8px 8px 2px; box-shadow: var(--elev-raised); }
.mini-nb .spiral { left: 6%; width: 12%; }
.mini-nb.a { background: var(--cov-sage); rotate: -6deg; translate: 14px 0; }
.mini-nb.b { position: absolute; background: var(--cov-navy) radial-gradient(circle, var(--paper) 2px, transparent 2.6px) 0 0 / 12px 12px; rotate: 7deg; translate: -22px 6px; }
.mini-day { width: 150px; padding: 12px; }
.mini-day .stamp { font-size: 12px; padding: 3px 8px; }
.mini-day .ln { height: 8px; margin-top: 10px; border-radius: 4px; background: var(--dot); }
.mini-day .ln.s { width: 60%; }
.mini-ticket { width: 170px; }

/* Ticket stub: the voice note */
.ticket { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 18px 14px 14px; background: var(--ticket); border: 2px dashed var(--ticket-edge); border-radius: 10px; color: var(--ink); -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) , radial-gradient(circle 9px at 100% 50%, transparent 98%, #000); -webkit-mask-composite: source-in; mask: radial-gradient(circle 9px at 0 50%, transparent 98%, #000) , radial-gradient(circle 9px at 100% 50%, transparent 98%, #000); mask-composite: intersect; }
.ticket .play { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--stamp); color: var(--accent-on); cursor: pointer; }
.ticket .play svg { width: 22px; height: 22px; fill: currentColor; }
.ticket .wave { flex: 1; display: flex; align-items: center; gap: 3px; height: 44px; }
.ticket .wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--ticket-edge); opacity: .45; transition: opacity .12s, background .12s; }
.ticket .wave i.on { opacity: 1; background: var(--stamp); }
.ticket .len { flex: none; font: 800 var(--text-sm)/1 var(--font-mono); color: var(--ink-soft); }

/* Toys: shared shell */
.toy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-12); align-items: center; }
.toy-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); align-items: center; }
.small-note { margin: var(--space-4) 0 0; font: 600 var(--text-sm)/1.45 var(--font-body); color: var(--ink-kraft); opacity: .85; max-width: 46ch; }
.band.paperband .small-note, .band.dotband .small-note { color: var(--ink-soft); }

/* Toy 1: draw your own cover */
.cv-wrap { justify-self: center; position: relative; width: min(380px, 80vw); }
.cv-book { position: relative; aspect-ratio: 3 / 4; border-radius: 3px 14px 14px 3px; box-shadow: var(--elev-raised), inset -6px 0 10px -6px rgba(0, 0, 0, .25); overflow: hidden; background: var(--cov, var(--cov-sage)); container-type: inline-size; }
.cv-book::after { content: ""; position: absolute; inset: 0; background-image: var(--grain); opacity: .5; mix-blend-mode: multiply; pointer-events: none; }
.cv-book[data-p="polka"] { background: var(--cov-navy) radial-gradient(circle, var(--paper) 2.6px, transparent 3.2px) 0 0 / 22px 22px; }
.cv-book[data-p="lines"] { background: repeating-linear-gradient(90deg, var(--cov-rose) 0 14px, var(--tape-pink-2) 14px 20px); }
.cv-book[data-p="kraft"] { background: var(--kraft); }
.cv-book canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; z-index: 1; }
.cv-book .tape { top: -4px; left: 50%; translate: -50% 0; width: 32%; height: 7%; }
.cv-book .label { position: absolute; z-index: 2; left: 22%; right: 10%; top: 62%; padding: 3% 4%; background: var(--paper); box-shadow: 0 2px 4px rgba(0, 0, 0, .2); rotate: -2deg; font: 700 13cqw/1 var(--font-display); color: var(--ink); text-align: center; pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cv-book .label:empty { display: none; }
.cv-book .spiral { z-index: 3; }
.cv-tip { position: absolute; z-index: 4; left: 50%; top: 40%; translate: -50% -50%; padding: 8px 14px; border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); font: 700 var(--text-sm)/1.1 var(--font-body); box-shadow: var(--elev-raised); pointer-events: none; transition: opacity var(--motion-base); white-space: nowrap; }
.cv-tip.gone { opacity: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: var(--space-6); padding: 0; border: 0; }
.swatches legend { font: 700 var(--text-sm)/1 var(--font-body); color: var(--ink-kraft); margin-bottom: 10px; }
.sw { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: 0 2px 6px -2px var(--shadow); }
.sw[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 3px solid var(--ink-kraft); }
.sw.polka { background: var(--cov-navy) radial-gradient(circle, var(--paper) 1.6px, transparent 2.2px) 0 0 / 9px 9px; }
.sw.lines { background: repeating-linear-gradient(90deg, var(--cov-rose) 0 5px, var(--tape-pink-2) 5px 8px); }
.namefield { display: grid; gap: 8px; margin-top: var(--space-5); max-width: 360px; }
.namefield span { font: 700 var(--text-sm)/1 var(--font-body); color: var(--ink-kraft); }
.namefield input, .notebox textarea { width: 100%; min-height: 48px; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--paper); color: var(--ink); font: 400 var(--text-xl)/1.3 var(--font-hand); }
.namefield input::placeholder, .notebox textarea::placeholder { color: var(--ink-soft); opacity: .75; }

/* Toy 2: write today's page */
.day { position: relative; justify-self: center; width: min(460px, 100%); min-height: 460px; padding: 34px 26px 26px 30px; box-shadow: var(--elev-raised); }
.day .head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.day .head .stamp { font-size: var(--text-base); }
.day .count { font: 400 var(--text-lg)/1 var(--font-hand); color: var(--ink-soft); }
.notes { list-style: none; margin: var(--space-5) 0 0; padding: 0; display: grid; gap: var(--space-5); }
.notes li { position: relative; }
.notes .t { display: block; font: 400 var(--text-lg)/1 var(--font-hand); color: var(--ink-soft); margin-bottom: 4px; }
.notes .x { display: block; font: 400 clamp(22px, 2.2vw, 26px)/1.3 var(--font-hand); color: var(--ink); overflow-wrap: anywhere; }
.notes li.new .x { animation: write 1.1s steps(24) both; }
.notes .empty { font: 400 var(--text-xl)/1.35 var(--font-hand); color: var(--ink-soft); }
.notebox { display: grid; gap: var(--space-3); margin-top: var(--space-6); max-width: 460px; }
.notebox textarea { min-height: 96px; resize: vertical; }

/* Voice */
.voice { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-12); align-items: center; }
.vcard { justify-self: center; width: min(480px, 100%); padding: 30px 24px 26px; box-shadow: var(--elev-raised); rotate: -1deg; }
.vcard .stamp { margin-bottom: var(--space-5); }
.heard { margin-top: var(--space-5); min-height: 6.6em; font: 400 clamp(22px, 2.2vw, 26px)/1.35 var(--font-hand); color: var(--ink); }
.heard .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; background: var(--stamp); vertical-align: -0.12em; }
.lang { display: inline-flex; align-items: center; gap: 8px; margin-top: var(--space-3); font: 700 var(--text-sm)/1.2 var(--font-body); color: var(--stamp); }

/* Private */
.priv { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: var(--space-12); align-items: center; }
.bigstamp { justify-self: center; display: grid; place-items: center; width: min(360px, 76vw); aspect-ratio: 1; border-radius: 50%; border: 6px double var(--stamp); color: var(--stamp); rotate: -10deg; text-align: center; font: 800 clamp(22px, 2.6vw, 30px)/1.15 var(--font-mono); letter-spacing: .04em; padding: 12%; mix-blend-mode: multiply; }
.bigstamp.in { animation: thunk .5s var(--ease-spring) both; }
@media (prefers-color-scheme: dark) { .bigstamp { mix-blend-mode: normal; } }
.bigstamp small { display: block; margin-top: 10px; font-size: .55em; }
.tags { list-style: none; margin: var(--space-8) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.tags li { position: relative; padding: var(--space-4) var(--space-5) var(--space-4) 52px; background: var(--surface); box-shadow: var(--elev-raised); font: 400 var(--text-lg)/1.3 var(--font-hand); color: var(--ink); }
.tags li::before { content: ""; position: absolute; left: 16px; top: 50%; translate: 0 -50%; width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--stamp); background: radial-gradient(circle, var(--stamp) 0 34%, transparent 38%); }
.tags li b { display: block; font: 700 26px/1 var(--font-display); }

/* Siri */
.siri { display: grid; gap: var(--space-4); max-width: 640px; margin-top: var(--space-8); }
.bubble { width: fit-content; max-width: 92%; padding: 14px 20px; border-radius: 24px; font: 400 var(--text-xl)/1.3 var(--font-hand); box-shadow: var(--elev-raised); }
.bubble.me { justify-self: end; background: var(--ink-kraft); color: var(--paper); border-bottom-right-radius: 6px; }
.bubble.her { background: var(--paper); color: var(--ink); border-bottom-left-radius: 6px; }

/* Price + FAQ */
.free { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: var(--space-12); align-items: start; margin-top: var(--space-8); }
.tag-price { position: relative; padding: var(--space-8) var(--space-6); background: var(--ticket); box-shadow: var(--elev-raised); rotate: -2deg; color: var(--ink); }
.tag-price .tape { top: -10px; left: 30px; }
.tag-price .amt { font: 700 clamp(72px, 8vw, 104px)/.9 var(--font-display); }
.tag-price ul { margin: var(--space-5) 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font: 400 var(--text-lg)/1.3 var(--font-hand); }
.tag-price li::before { content: "✓ "; color: var(--stamp); font-family: var(--font-body); font-weight: 800; }
.faq { display: grid; gap: var(--space-3); }
.faq details { background: var(--surface); box-shadow: var(--elev-raised); border-radius: 4px; }
.faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-5); min-height: 56px; font: 700 var(--text-lg)/1.3 var(--font-body); color: var(--ink); }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--stamp); color: var(--stamp); font: 800 20px/1 var(--font-body); transition: rotate var(--motion-base) var(--ease-standard); }
.faq details[open] summary::after { rotate: 45deg; }
.faq details p { margin: 0; padding: 0 var(--space-5) var(--space-5); color: var(--ink-soft); font: 500 var(--text-base)/1.55 var(--font-body); }

.end { text-align: center; }
.end .stack { position: relative; width: 220px; height: 190px; margin: 0 auto var(--space-6); }
.end .stack .mini-nb { position: absolute; left: 50%; top: 10px; width: 112px; height: 148px; translate: -50% 0; }
.end .stack .mini-nb:nth-child(1) { background: var(--cov-mustard); rotate: -14deg; translate: -96% 8px; }
.end .stack .mini-nb:nth-child(2) { background: var(--cov-teal); rotate: 10deg; translate: -4% 4px; }
.end .stack .mini-nb:nth-child(3) { background: var(--cov-tomato); rotate: -2deg; }
.end .cta-row { justify-content: center; }
.end h2.hand { max-width: 18ch; margin-inline: auto; }
footer { position: relative; z-index: 1; padding-block: var(--space-8) var(--space-12); text-align: center; color: var(--ink-kraft); font: 600 var(--text-sm)/1.6 var(--font-body); }
footer a { font-weight: 800; }
footer .credits { display: block; margin-top: var(--space-2); font-size: 13px; opacity: .8; }

@media (min-width: 720px) {
  section.band { padding-block: var(--section-y-tablet); }
  .wrap { width: min(var(--container-max), 100% - 2 * var(--container-gutter-tablet)); }
}
@media (min-width: 1100px) {
  section.band { padding-block: var(--section-y-desktop); }
  .wrap { width: min(var(--container-max), 100% - 2 * var(--container-gutter-desktop)); }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: var(--space-6); min-height: 0; padding-top: var(--space-2); }
  .desk { border-radius: 26px; }
  .copy { text-align: center; }
  .copy .one { margin-inline: auto; }
  .copy .cta-row { justify-content: center; margin-top: var(--space-5); }
  .real, .toy, .voice, .priv, .free { grid-template-columns: 1fr; gap: var(--space-8); }
  .scraps, .steps { grid-template-columns: 1fr; }
  .scrap:nth-child(2) { translate: none; }
  .tags { grid-template-columns: 1fr; }
  .chip.soon { display: none; }
  .day { min-height: 360px; }
}
@media (prefers-reduced-motion: reduce) {
  .cover .face, .cover .back { transition: none; }
  html { scroll-behavior: auto; }
  .drift { display: none; }
  .book, .cover, .shot, .dropped, .bigstamp.in, .book .sheet .stamp { transition: none; animation: none; }
  .book .sheet .line { transition: none; }
  .notes li.new .x { animation: none; clip-path: none; }
  .book .sheet .hint-in { transition: none; }
  .toast, .tap-me, .cv-tip { transition: none; }
}

/* Horizontal panels (after Hugas): on a wide screen the page pins and scrolling down turns the pages to the right;
   on a phone it is a swipe deck. The turn: the incoming page arrives with a lifted edge (a curl highlight and the shadow
   it throws on the page below), the page underneath sinks and dims, content settles at staggered depths, the heading
   sharpens from a blur, and a pencil rides the rail drawing your progress. All one-directional. */
.hx { position: relative; z-index: 1; }
.hx-pin { position: relative; }
.hx-track { display: flex; }
.hx-panel { position: relative; flex: 0 0 var(--vw, 100vw); width: var(--vw, 100vw); }
.hx-panel > section { position: relative; height: 100%; background-color: var(--bg); transform-origin: 0% 62%; }
.hx-panel > section.night { background-color: var(--night); }
.hx-panel > section.paperband, .hx-panel > section.dotband { background-color: var(--paper); }
.hx-panel::after { content: ""; position: absolute; inset: 0; z-index: 2; background: var(--night); opacity: var(--dim, 0); pointer-events: none; }
.hx-curl { position: absolute; z-index: 3; left: 0; top: 0; bottom: 0; width: 0; pointer-events: none; visibility: hidden; }
.hx-curl::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 255, 255, .0), rgba(255, 255, 255, .55) 40%, rgba(0, 0, 0, .10) 100%); }
.hx-curl::after { content: ""; position: absolute; top: 0; bottom: 0; right: 100%; width: var(--sh, 0px); background: linear-gradient(270deg, rgba(30, 18, 6, .35), rgba(30, 18, 6, 0)); }
.hx-panel > section { z-index: 1; }
.hx [data-d] { translate: calc(var(--in, 0) * var(--d) * var(--vw, 100vw)) 0; }
.hx .hx-panel h2.hand, .hx .hx-panel h1.hand { filter: blur(calc(var(--in, 0) * 8px)); opacity: calc(1 - var(--in, 0) * .7); }
.hx.no-para [data-d] { translate: none; }
.hx.no-para .hx-panel h2.hand, .hx.no-para .hx-panel h1.hand { filter: none; opacity: 1; }

.hx-rail { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: 12px; background: var(--paper); box-shadow: 0 -2px 8px -4px var(--shadow); pointer-events: none; opacity: 0; transition: opacity var(--motion-base); }
.hx-rail i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: repeating-linear-gradient(-45deg, var(--tape-pink) 0 8px, var(--tape-pink-2) 8px 16px); }
.hx-rider { position: fixed; z-index: 31; left: 0; bottom: 6px; width: 92px; height: 40px; pointer-events: none; opacity: 0; transition: opacity var(--motion-base); transform-origin: 100% 100%; }
.hx-rider svg { width: 100%; height: 100%; overflow: visible; display: block; }
.hx-trail { position: fixed; z-index: 29; width: var(--s); height: var(--s); border-radius: 50%; background: var(--ink); opacity: .5; pointer-events: none; animation: hxtrail 1.2s ease-out forwards; }
@keyframes hxtrail { from { transform: translate(-50%, 0) scale(1); opacity: .5; } to { transform: translate(-50%, -40px) scale(.3); opacity: 0; } }
.hx-nav { position: fixed; z-index: 32; right: 16px; bottom: 24px; display: flex; align-items: center; gap: var(--space-2); opacity: 0; pointer-events: none; transition: opacity var(--motion-base); }
.hx-nav .n { min-width: 64px; padding: 8px 12px; border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); box-shadow: 0 4px 12px -6px var(--shadow); font: 800 var(--text-xs)/1 var(--font-mono); text-align: center; }
.hx-live .hx-rail, .hx-live .hx-rider { opacity: 1; }
.hx-live .hx-nav { opacity: 1; pointer-events: auto; }
.hx-hintx { position: absolute; z-index: 4; left: 50%; bottom: 32px; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--radius-pill); background: var(--paper); color: var(--ink); box-shadow: var(--elev-raised); font: 700 var(--text-sm)/1 var(--font-body); pointer-events: none; transition: opacity var(--motion-base); }
.hx-hintx svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hx-moved .hx-hintx { opacity: 0; }

.hx.is-pin .hx-pin { position: sticky; top: 0; height: 100svh; overflow: hidden; background: var(--night); }
.hx.is-pin .hx-track { height: 100%; will-change: transform; }
.hx.is-pin .hx-panel { height: 100%; }
.hx.is-pin .hx-panel > section { display: flex; align-items: center; padding-block: 92px 60px; overflow-y: auto; scrollbar-width: none; }
.hx.is-pin .hx-panel > section > .wrap { width: min(var(--container-max), 100% - 2 * var(--container-gutter-desktop)); }
.hx.is-pin .hero { min-height: 0; padding-bottom: 0; }
.hx.is-pin .desk { width: min(100%, calc(100svh - 200px)); margin-inline: auto; }

  hx.className = 'hx'; hx.id = 'hx';
  hx.innerHTML = '<div class="hx-pin"><div class="hx-track"></div></div>';
  bands[0].before(hx);
  heroWrap.appendChild(main);
  const track = hx.querySelector('.hx-track');
  const secs = [heroSec, ...bands];
  const panels = secs.map((s, i) => {
    const p = document.createElement('div');
    p.className = 'hx-panel';
    p.style.zIndex = i + 1;
    track.appendChild(p);
    p.appendChild(s);
    if (i) { const c = document.createElement('div'); c.className = 'hx-curl'; p.prepend(c); }
    return p;
  });
  const hint = document.createElement('div');
  hint.className = 'hx-hintx';
  hint.setAttribute('aria-hidden', 'true');
  hint.innerHTML = '<span>' + esc(SETTINGS.hx_hint) + '</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
  const heroCopy = heroSec.querySelector('.copy');

  if (fx.para) panels.forEach(p => {
    const pieces = p.querySelectorAll('.kick, h1, h2, .lead, .one, .cost, .small-note, .cta-row, .store-hint, .desk, .pile, .says, .pile-nav, .cv-wrap, .swatches, .namefield, .toy-actions, .day, .notebox, .vcard, .bigstamp, .stack, .scraps > *, .steps > *, .tags > *, .siri > *, .tag-price, .faq > *');
    pieces.forEach((el, k) => { el.style.setProperty('--d', Math.min(.1 + k * .05, .5).toFixed(2)); el.setAttribute('data-d', ''); });
  });
  if (!fx.para) hx.classList.add('no-para');

  const ui = document.createElement('div');
  ui.setAttribute('aria-hidden', 'true');
  ui.innerHTML = '<div class="hx-rail"><i></i></div><div class="hx-rider"><svg viewBox="0 0 200 88"><g transform="rotate(-12 100 60)"><path class="p-end" d="M6 48h16v18H6z"/><path class="p-band" d="M22 46h12v22H22z"/><path class="p-wood" d="M34 46h120v22H34z"/><path class="p-shave" d="M154 46l34 11-34 11z"/><path class="p-lead" d="M180 54l10 3-10 3z"/></g></svg></div>';
  document.body.appendChild(ui);
  const rail = ui.querySelector('.hx-rail'), rider = ui.querySelector('.hx-rider');
  if (!fx.ride) rider.hidden = true;
  const nav = document.createElement('nav');
  nav.className = 'hx-nav';
  nav.setAttribute('aria-label', SETTINGS.hx_nav);
  nav.innerHTML = '<button class="iconbtn" type="button" data-go="-1" aria-label="' + esc(SETTINGS.hx_prev) + '"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="n" aria-live="polite"></span><button class="iconbtn" type="button" data-go="1" aria-label="' + esc(SETTINGS.hx_next) + '"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>';
  document.body.appendChild(nav);
  const counter = nav.querySelector('.n');

  let vw = 0, vh = 0, pin = false, total = 0, x = 0, lastX = 0, tilt = 0, active = -1, lastTrail = 0, moved = false, snap = false;
  const dot = (left, bottom, size) => {
    const b = document.createElement('i');
    b.className = 'hx-trail';
    b.style.setProperty('--s', size.toFixed(1) + 'px');
    b.style.left = left + 'px'; b.style.bottom = bottom + 'px';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 1200);
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function layout() {
    vw = root.clientWidth; vh = innerHeight;
    root.style.setProperty('--vw', vw + 'px');
    pin = wide.matches;
    root.classList.toggle('hx-pinmode', pin);
    root.classList.toggle('hx-deckmode', !pin);
    (pin ? panels[0] : heroCopy || panels[0]).appendChild(hint);
    hx.classList.toggle('is-pin', pin);
    hx.classList.toggle('is-deck', !pin);
    if (pin) { track.style.height = ''; total = Math.max(0, track.scrollWidth - vw); hx.style.height = (vh + total) + 'px'; }
    else { hx.style.height = ''; track.style.transform = ''; total = Math.max(0, track.scrollWidth - vw); }
  }
  function target() { return pin ? clamp(scrollY - hx.offsetTop, 0, total) : track.scrollLeft; }
  function go(i) {
    i = clamp(i, 0, panels.length - 1);
    const behavior = reduce ? 'auto' : 'smooth';
    if (pin) { scrollTo({ top: hx.offsetTop + i * vw, behavior }); return; }
    track.scrollTo({ left: i * vw, behavior });
    if (hx.getBoundingClientRect().top < -8) scrollTo({ top: scrollY + hx.getBoundingClientRect().top, behavior });
  }
  function setActive(i) {
    if (i === active) return;
    if (active >= 0) document.dispatchEvent(new CustomEvent('hx:panel', { detail: i }));
    active = i;
    counter.textContent = (i + 1) + ' / ' + panels.length;
    if (!pin) track.style.height = panels[i].querySelector(':scope > section').offsetHeight + 'px';
  }

  function frame(t) {
    const tx = target();
    x = (reduce || !pin || snap) ? tx : x + (tx - x) * .12;
    snap = false;
    if (Math.abs(tx - x) < .4) x = tx;
    if (pin) track.style.transform = 'translate3d(' + (-x).toFixed(2) + 'px,0,0)';
    if (x > 8 && !moved) { moved = true; hx.classList.add('hx-moved'); root.classList.add('hx-went'); }
    const r = hx.getBoundingClientRect();
    const live = r.top < vh * .5 && r.bottom > vh * .5;
    root.classList.toggle('hx-live', live);

    for (let i = 0; i < panels.length; i++) {
      const p = panels[i], s = p.querySelector(':scope > section');
      const o = (i * vw - x) / vw;
      if (o > 1.05 || o < -1.05) continue;
      const enter = clamp(o, 0, 1), leave = clamp(-o, 0, 1);
      p.style.setProperty('--in', fx.para ? enter.toFixed(4) : 0);
      /* The page underneath sinks back: slower, a touch smaller, dimmer */
      if (fx.turn && leave > 0 && i < panels.length - 1) {
        s.style.transform = 'translate3d(' + (leave * vw * .45).toFixed(1) + 'px,0,0) scale(' + (1 - leave * .05).toFixed(4) + ')';
        p.style.setProperty('--dim', (leave * .4).toFixed(3));
      } else { s.style.transform = ''; p.style.setProperty('--dim', 0); }
      /* The incoming page arrives with a lifted edge: highlight on its edge, shadow thrown on the page below */
      const curl = i > 0 ? p.firstElementChild : null;
      if (curl) {
        const lift = fx.turn && enter > 0.002 && enter < 0.998 ? Math.sin(Math.PI * enter) : 0;
        if (lift > 0.01) {
          curl.style.visibility = 'visible';
          curl.style.width = (lift * Math.min(120, vw * .09)).toFixed(1) + 'px';
          curl.style.setProperty('--sh', (lift * Math.min(160, vw * .12)).toFixed(1) + 'px');
        } else curl.style.visibility = 'hidden';
      }
    }
    const pr = total ? x / total : 0;
    rail.style.setProperty('--p', pr.toFixed(4));
    setActive(clamp(Math.round(x / vw), 0, panels.length - 1));

    /* The pencil rides the rail: tilts with speed, settles without bouncing, leaves graphite dots */
    if (fx.ride && live) {
      const v = (x - lastX) / vw;
      tilt += (clamp(v * 140, -14, 14) - tilt) * .15;
      const left = 4 + pr * (vw - 100);
      rider.style.transform = 'translate3d(' + left.toFixed(1) + 'px,0,0) rotate(' + tilt.toFixed(2) + 'deg)';
      if (!reduce && Math.abs(v) > .003 && t - lastTrail > 60) { lastTrail = t; dot(left + 88, 10 + Math.random() * 6, 2 + Math.random() * 3); }
    }
    lastX = x;
    requestAnimationFrame(frame);
  }

  const pinEl = hx.querySelector('.hx-pin');
  pinEl.addEventListener('scroll', () => {
    if (!pin || !pinEl.scrollLeft) return;
    const want = clamp(x + pinEl.scrollLeft, 0, total);
    pinEl.scrollLeft = 0; snap = true;
    scrollTo({ top: hx.offsetTop + want, behavior: 'instant' });
  });
  nav.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(active + +b.dataset.go); });
  addEventListener('keydown', e => {
    if (!root.classList.contains('hx-live') || e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(active - 1); }
  });
  hx.addEventListener('focusin', e => { const i = panels.findIndex(p => p.contains(e.target)); if (i >= 0 && i !== active) go(i); });
  if (!pin) track.addEventListener('scrollend', () => { track.style.height = panels[active].querySelector(':scope > section').offsetHeight + 'px'; });
  new ResizeObserver(() => { layout(); if (!pin && active >= 0) track.style.height = panels[active].querySelector(':scope > section').offsetHeight + 'px'; }).observe(document.body);
  wide.addEventListener('change', layout);
  addEventListener('resize', layout);
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
